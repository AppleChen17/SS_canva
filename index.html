<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./icon/apple-whole-solid.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Apple's canvas</title>
</head>
<body>
    <nav>
        <h2> # include &lt; canvas &gt;</h2>
    </nav>

    <section class="main">
        <div class="canvas">
            <canvas id="background"></canvas>
            <canvas id="canva-area">
                An alternative text describing what your canvas displays.
            </canvas>
        </div>

        <section class="tool-box">
            <h4 style="margin-top: 5px; width: 90%; text-align: center; display: block; font-size: 1.2rem; background-color: rgb(251, 179, 153,0.5);">paint-tool</h4>
            <div class="paint-tool">
                <button class="btn-func" onclick="onClick('pen')">
                    <i class="fa-solid fa-pen"></i>
                </button>
                <button class="btn-func" onclick="onClick('eraser')">
                    <i class="fa-solid fa-eraser"></i>
                </button >
                <button class="btn-func" onclick="onClick('text')">
                    <i class="fa-solid fa-font"></i>
                </button>
                <button class="btn-func" onclick="onClick('circle')">
                    <i class="fa-regular fa-circle"></i>
                </button>
                <button class="btn-func" onclick="onClick('rectangle')">
                    <i class="fa-regular fa-square" ></i>
                </button>
                <button class="btn-func" onclick="onClick('triangle')">
                    <i class="fa-solid fa-caret-up" ></i>
                </button>

                <!-- file uploading ! -->
                <input type="file" id="fileInput" style="display: none;">
                <button class="btn-func" onclick="onClick('upload')">
                    <i class="fa-solid fa-arrow-up-from-bracket"></i>
                </button>
                
                <button class="btn-func" onclick="onClick('save')">
                    <i class="fa-solid fa-download"></i>
                </button>

                <br>

                <button class="btn-func" onclick="onClick('undo')">
                    <i class="fa-solid fa-rotate-left" ></i>
                </button>
                <button class="btn-func" onclick="onClick('redo')"> 
                    <i class="fa-solid fa-rotate-right" ></i>
                </button>

                <!-- refresh -->
                <button class="btn-func" onclick="onClick('reset')">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>

            <hr style="top: 230px; margin: 5px; border-color: #6C6C6C; border-style: solid; width: 100%;">
            <!-- <hr style="border-width: 5px;border-color:  #6C6C6C;border-style: solid; display: block;"> -->
            <!-- brush size, font list -->
            <!-- brush 粗度、顏色透明度、選取顏色 -->
            <section class="style-tool">
                <h4 style="text-align: center; margin-top: 10px; font-size: 1.2rem; margin-bottom: 5px; background-color: rgb(251, 179, 153,0.5);">Style</h4>

                <!-- <br> -->
                <h5>Brush size 🖌️</h5>
                <input type="range" min="1" max="20" value="5" class="slider" id="sizeSlider">

                <!-- <h5>Opacity</h5>
                <input type="range" min="1" max="100" value="100" class="slider" id="opacitySlider"> -->
                <br>
                <h5 style="display: inline;">Font size</h5>
                <select id="fontSize">
                    <!-- value => what it would return back -->
                    <option value="18px">18</option>
                    <option value="20px">20</option>
                    <option value="22px">22</option>
                    <option value="24px">24</option>
                    <option value="26px">26</option>
                    <option value="28px">28</option>
                    <option value="30px">30</option>
                </select>

                <h5 style="display: inline;">Font Type</h5>
                <select id="fontType">
                    <option value="Arial">Arial</option>
                    <option value="sans-serif">sans-serif</option>
                    <option value="Times">Times</option>
                    <option value="Courier New">Courier New</option>
                </select>

                <br>
                <div class="checkbox" style="display: flexbox; align-items: center">
                    <input style="margin-top: 10px;" type="checkbox" id="filled" name="shape_filled"/>
                    <h5 style="display: inline;">Shaped Filled</h5>
                    <!-- <label style="margin-top: 5px;" for="shape_filled">Shape filled</label> -->
                </div>

                <br>
                <h5 style="margin-top: 5px;">Color selector (click me : D)  🎨</h5>

                <div class="colorSelector">
                    <!-- the preview area -->
                    <div class="colorPreview" id="colorPreview"></div>
            
                    <div class="colorPanel" id="colorPanel">
                        <div class="colorMap" id="colorMap">
                            <div class="colorCursor" id="colorCursor">
                            </div>
                        </div>
                        <div class="hueSlider" id="hueSlider">
                            <div class="hueCursor" id="hueCursor">
                            </div>
                        </div>

                        <!-- to first fill it with placeholder -->
                        <input type="text" class="hexInput" id="hexInput" placeholder="#FF0000">
                    </div>
                </div>
            </section>
        </section>
    </section>

</body>
</html>

<!-- p5.js library
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script> -->
<script src="app.js" defer></script>
