<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Apple's canvas</title>
</head>
<body>
    <nav>
        <h2> # include &lt; canvas &gt;</h2>
    </nav>

    <section class="main">
        <div class="canvas">
            <canvas id="background"></canvas>
            <canvas id="canva-area">
                An alternative text describing what your canvas displays.
            </canvas>
        </div>

        <section class="tool-box">
            <h4 style="font-size: 1.2rem">paint-tool 🎨</h4>
            <div class="paint-tool">
                <button class="btn-func" onclick="onClick('pen')">
                    <i class="fa-solid fa-pen"></i>
                </button>
                <button class="btn-func" onclick="onClick('eraser')">
                    <i class="fa-solid fa-eraser"></i>
                </button >
                <button class="btn-func">
                    <i class="fa-solid fa-font" onclick="onClick('text')"></i>
                </button>
                <button class="btn-func">
                    <i class="fa-regular fa-circle" onclick="onClick('circle')"></i>
                </button>
                <button class="btn-func">
                    <i class="fa-regular fa-square" onclick="onClick('rectangle')"></i>
                </button>
                <button class="btn-func">
                    <i class="fa-solid fa-caret-up" onclick="onClick('triangle')"></i>
                </button>

                <!-- file uploading ! -->
                <input type="file" id="fileInput" style="display: none;">
                <button class="btn-func" onclick="onClick('upload')">
                    <i class="fa-solid fa-arrow-up-from-bracket"></i>
                </button>
                
                <button class="btn-func" onclick="onClick('save')">
                    <i class="fa-solid fa-download"></i>
                </button>

                <br>

                <button class="btn-func">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
                <button class="btn-func">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>

                <!-- refresh -->
                <button class="btn-func" onclick="onClick('reset')">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>

            <hr style="top: 240px; margin: 5px; border-color: #6C6C6C; border-style: solid; width: 100%;">
            <!-- <hr style="border-width: 5px;border-color:  #6C6C6C;border-style: solid; display: block;"> -->
            <!-- brush size, font list -->
            <!-- brush 粗度、顏色透明度、選取顏色 -->
            <section class="style-tool">
                <h4 style="margin-top: 15px; font-size: 1.2rem; margin-bottom: 5px;">Style</h4>

                <!-- <br> -->
                <h5>Brush size 🖌️</h5>
                <input type="range" min="1" max="20" value="5" class="slider" id="sizeSlider">

                <!-- <h5>Opacity</h5>
                <input type="range" min="1" max="100" value="100" class="slider" id="opacitySlider"> -->
                <br>
                <h5 style="display: inline;">字型大小</h5>
                <select id="fontSize">
                    <option>18</option>
                    <option>20</option>
                    <option>22</option>
                    <option>24</option>
                    <option>26</option>
                    <option>28</option>
                    <option>30</option>
                </select>

                <h5 style="display: inline;">字體種類</h5>
                <select id="fontType">
                    <!-- TODO:modify ! -->
                    <option>Arial</option>
                    <option>Impact</option>
                    <option>Times</option>
                    <option>Courier New</option>
                    <option>Copperplate</option>
                </select>

                <br>
                <input style="margin-top: 10px;" type="checkbox" id="filled" name="shape_filled"/>
                <h5 style="display: inline;">Shaped Filled</h5>
                <!-- <label style="margin-top: 5px;" for="shape_filled">Shape filled</label> -->
            </section>

        </section>
    </section>

</body>
</html>

<!-- p5.js library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
<script src="app.js" defer></script>
